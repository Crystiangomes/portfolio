<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>

    <!-- CSS PADRÃO DO SITE -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <div class="nav-container">
        <div class="logo">Crystian</div>

        <ul class="nav-list">
            <li><a href="../index.html">Início</a></li>
            <li><a href="projetos.html">Projetos</a></li>
            <li><a href="contato.html" class="ativo">Contato</a></li>
        </ul>
    </div>
</header>

<!-- HEADER DA PÁGINA -->
<section class="page-header">
    <h2>Contato</h2>
    <p>Entre em contato comigo para ideias, projetos ou dúvidas.</p>
</section>

<!-- CONTEÚDO -->
<section class="pagina">
    <div class="container contato-container">

        <div class="card-contato">
            <form class="form-contato">

                <div class="grupo-form">
                    <label>Nome</label>
                    <input type="text" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="grupo-form">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Digite seu email" required>
                </div>

                <div class="grupo-form">
                    <label>Mensagem</label>
                    <textarea name="mensagem" rows="5" placeholder="Digite sua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>

            </form>
        </div>

    </div>
</section>

<footer class="footer">
    <p>© 2026 Crystian Gomes - Todos os direitos reservados</p>
</footer>
<script src="../js/script.js"></script>
</body>
</html>
