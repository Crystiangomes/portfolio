<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo">SE QUISER ENVIAR MENSAGEM</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="pagina">
    <div class="container">

        <div class="titulo-pagina">
            <h1>Entre em Contato</h1>
            <p>Tem alguma ideia ou projeto? Vamos conversar.</p>
        </div>

        <div class="card-contato">
            <form class="form-contato">

                <div class="grupo-form">
                    <label>Nome</label>
                    <input type="text" placeholder="Digite seu nome" required>
                </div>

                <div class="grupo-form">
                    <label>Email</label>
                    <input type="email" placeholder="Digite seu email" required>
                </div>

                <div class="grupo-form">
                    <label>Mensagem</label>
                    <textarea rows="5" placeholder="Digite sua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>

            </form>
        </div>

    </div>
</section>

<footer>
    <div class="container">
        <p>© 2026 - Crystian</p>
    </div>
</footer>

</body>
</html>
